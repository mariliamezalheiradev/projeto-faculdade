<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - FlowSalon</title>
    <link rel="stylesheet" href="css/agendamento.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        
        <div class="confirmation-screen" id="confirmationScreen" style="display: none;">
            <div class="success-icon-big">🌊</div>
            <h2>Agendamento Confirmado!</h2>
            <p class="confirmation-text">Em breve enviaremos a confirmação com todos os detalhes pelo WhatsApp.</p>
            
            <div class="appointment-details" id="appointmentDetails"></div>
 
            <div class="confirmation-actions">
                <button onclick="novoAgendamento()" class="btn-reset">Fazer Novo Agendamento</button>
                <a href="https://wa.me/5511999999999" target="_blank" class="whatsapp-btn">
                    <i class="fab fa-whatsapp"></i> Falar no WhatsApp
                </a>
            </div>
        </div>
 
        <div id="formContainer">
            <header class="header">
                <img src="https://files.catbox.moe/5lsyja.jpeg" alt="FlowSalon" class="logo">
                <p style="text-align: center; color: #888;">Agende seu horário com estilo</p>
            </header>
 
            <div class="info-box">
                <strong>ℹ️</strong> Preencha os dados abaixo para agendar seu atendimento.
            </div>
 
            <form id="agendamentoForm" novalidate>
                <div class="form-group">
                    <label for="nome">Nome Completo <span class="required">*</span></label>
                    <input type="text" id="nome" required placeholder="Digite seu nome completo">
                </div>
 
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">E-mail <span class="required">*</span></label>
                        <input type="email" id="email" required placeholder="seu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone / WhatsApp <span class="required">*</span></label>
                        <input type="tel" id="telefone" required placeholder="(11) 98765-4321">
                    </div>
                </div>
 
                <div class="form-group">
                    <label for="cep">CEP <span class="required">*</span></label>
                    <div class="cep-wrapper">
                        <input type="text" id="cep" maxlength="9" placeholder="00000-000">
                        <button type="button" id="buscarCep" class="btn-buscar">Buscar</button>
                    </div>
                </div>
 
                <div class="form-group">
                    <label for="rua">Endereço</label>
                    <input type="text" id="rua" placeholder="Rua, Avenida...">
                </div>
 
                <div class="form-row">
                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro">
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade">
                    </div>
                </div>
 
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" maxlength="2" style="width: 120px;">
                </div>
 
                <div class="form-group">
                    <label for="servico">Serviço Desejado <span class="required">*</span></label>
                    <select id="servico" required>
                        <option value="" disabled selected>Carregando serviços do painel...</option>
                    </select>
                </div>
 
                <div class="form-group">
                    <label for="profissional">Profissional Preferencial</label>
                    <select id="profissional">
                        <option value="Qualquer">Qualquer profissional</option>
                    </select>
                </div>
 
                <div class="form-row">
                    <div class="form-group">
                        <label for="data">Data <span class="required">*</span></label>
                        <input type="date" id="data" required>
                    </div>
                    <div class="form-group">
                        <label for="hora">Hora <span class="required">*</span></label>
                        <input type="time" id="hora" required>
                    </div>
                </div>
 
                <div class="form-group">
                    <label for="observacoes">Observações</label>
                    <textarea id="observacoes" rows="4" placeholder="Ex: Quero franja, sou alérgica..."></textarea>
                </div>
 
                <div class="button-group">
                    <button type="reset" class="btn-reset">Limpar</button>
                    <button type="submit" class="btn-submit">AGENDAR AGORA</button>
                </div>
            </form>
        </div>
    </div>
 
    <script src="js/core.js"></script>
    <script src="js/agendamento.js"></script>
</body>
</html>
