<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro do Salão</title>
    <link rel="stylesheet" href="css/cadastro-salao.css">
</head>
<body>

<div class="container">
    <h2>Cadastro do Salão</h2>
    <form>
        <div class="campo">
            <label>Nome do Salão:</label>
            <input type="text" id="nome_salao" required placeholder="Nome do Salão">
        </div>

        <div class="campo">
            <label>Nome completo:</label>
            <input type="text" id="nome_completo" required placeholder="Nome completo">
        </div>

        <div class="campo">
            <label>E-mail:</label>
            <input type="email" id="email" required placeholder="E-mail">
        </div>

        <div class="campo">
            <label>CNPJ:</label>
            <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
        </div>

        <div class="campo">
            <label>CPF:</label>
            <input type="text" id="cpf" placeholder="000.000.000-00">
        </div>

        <div class="campo">
            <label>Celular:</label>
            <input type="text" id="celular" placeholder="(00) 00000-0000">
        </div>

        <div class="campo">
            <label>CEP:</label>
            <input type="text" id="cep" placeholder="00000-000">
        </div>

        <div class="campo">
            <label>Logradouro</label>
            <input type="text" id="logradouro" required placeholder="Rua/Av">
        </div>

        <div class="campo">
            <label>Estado</label>
            <input type="text" id="estado" required placeholder="UF">
        </div>

        <div class="campo">
            <label>Cidade</label>
            <input type="text" id="cidade" required placeholder="Cidade">
        </div>

        <div class="campo">
            <label>Bairro</label>
            <input type="text" id="bairro" required placeholder="Bairro">
        </div>

        <div class="campo">
            <label>Número</label>
            <input type="text" id="numero" required placeholder="Nº">
        </div>

        <div class="campo">
            <label>Complemento</label>
            <input type="text" id="complemento" placeholder="Apto/Bloco">
        </div>

        <div></div> <div class="campo">
            <label>Senha:</label>
            <input type="password" id="senha" required placeholder="Senha">
            <div id="forca-senha-bar"></div>
            <small id="forca-senha-texto"></small>
        </div>

        <div class="campo">
            <label>Confirmar senha:</label>
            <input type="password" id="confirmarsenha" required placeholder="Confirmar senha">
        </div>

        <button type="submit">Cadastrar Salão</button>
    </form>
</div>
<script src="script.js"></script> 

    <script src="js/core.js"></script>
    <script src="js/cadastro-salao.js"></script>
</body>

</body>
</html>
